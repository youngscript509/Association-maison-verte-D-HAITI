backend:
  name: git-gateway
  branch: main

# Où sont stockées les images/fichiers ajoutés depuis le CMS
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "fr"

collections:

  # ------------------------------------------------------------------
  # 1) RÉGLAGES DU SITE — menu, coordonnées, mot du coordonnateur, dons
  # ------------------------------------------------------------------
  - name: "reglages"
    label: "⚙️ Réglages du site"
    files:

      - name: "menu"
        label: "Menu de navigation"
        file: "_data/nav.yml"
        fields:
          - label: "Liens du menu (glisser pour réordonner)"
            name: "items"
            widget: "list"
            fields:
              - { label: "Texte affiché", name: "label", widget: "string" }
              - { label: "Lien (ex: /apropos/ ou /#contact)", name: "url", widget: "string" }
              - { label: "Mettre en avant comme un bouton ?", name: "cta", widget: "boolean", required: false, default: false }

      - name: "coordonnees"
        label: "Coordonnées & réseaux sociaux"
        file: "_data/site.yml"
        fields:
          - { label: "Nom de l'organisation", name: "organisation", widget: "string" }
          - { label: "Slogan", name: "tagline", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Email de contact", name: "email", widget: "string" }
          - { label: "Adresse", name: "address", widget: "string" }
          - { label: "Lien Google Maps (URL d'intégration \"embed\")", name: "map_embed_url", widget: "text" }
          - { label: "Facebook (laisser vide si aucun)", name: "facebook_url", widget: "string", required: false }
          - { label: "Twitter / X (laisser vide si aucun)", name: "twitter_url", widget: "string", required: false }
          - { label: "Instagram (laisser vide si aucun)", name: "instagram_url", widget: "string", required: false }
          - { label: "LinkedIn (laisser vide si aucun)", name: "linkedin_url", widget: "string", required: false }
          - { label: "Texte de la newsletter (footer)", name: "newsletter_text", widget: "text" }
          - { label: "Texte partenaire (footer)", name: "footer_partner_text", widget: "string" }
          - { label: "Lien du partenaire (footer)", name: "footer_partner_url", widget: "string" }
          - { label: "Nom du concepteur du site", name: "credit_name", widget: "string" }
          - { label: "Lien du concepteur du site", name: "credit_url", widget: "string" }

      - name: "accueil"
        label: "Page d'accueil (bandeau + mot du coordonnateur)"
        file: "_data/home.yml"
        fields:
          - label: "Bandeau principal (hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge (petit texte)", name: "badge", widget: "string" }
              - { label: "Accroche courte", name: "tagline", widget: "string" }
              - { label: "Titre principal", name: "title", widget: "string" }
              - { label: "Paragraphe", name: "text", widget: "text" }
              - { label: "Texte du 1er bouton", name: "button1_text", widget: "string" }
              - { label: "Lien du 1er bouton", name: "button1_link", widget: "string" }
              - { label: "Texte du 2e bouton", name: "button2_text", widget: "string" }
              - { label: "Lien du 2e bouton", name: "button2_link", widget: "string" }
              - { label: "Petite note sous les boutons", name: "small_text", widget: "string" }
          - label: "Mot du coordonnateur"
            name: "coordinateur"
            widget: "object"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Fonction", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Message", name: "message", widget: "text" }

      - name: "don"
        label: "Section \"Faire un don\""
        file: "_data/don.yml"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte d'introduction", name: "intro", widget: "text" }
          - { label: "Options de don (une par ligne)", name: "options", widget: "list" }
          - { label: "Texte du bouton", name: "button_text", widget: "string" }
          - { label: "Lien du bouton", name: "button_link", widget: "string" }

  # ------------------------------------------------------------------
  # 2) ACTUALITÉS — apparaissent sur l'accueil, /blog/ et /presses/
  # ------------------------------------------------------------------
  - name: "posts"
    label: "📰 Actualités"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Résumé (affiché sur les listes)", name: "excerpt", widget: "text" }
      - { label: "Lien vers l'article complet (source externe, ou laisser vide)", name: "link", widget: "string", required: false }
      - { label: "Nom de la source (ex: lenouveliste.com)", name: "reference", widget: "string", required: false }
      - { label: "Publier cet article ?", name: "active", widget: "boolean", default: true }
      - { label: "Contenu complet (optionnel)", name: "body", widget: "markdown", required: false }

  # ------------------------------------------------------------------
  # 3) ÉDITIONS DU FESTIVAL CINÉCOLO
  # ------------------------------------------------------------------
  - name: "leseditions"
    label: "🎬 Éditions du festival Cinécolo"
    folder: "_leseditions"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre (ex: Édition 2018)", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Invité(e) d'honneur", name: "invite", widget: "string" }
      - { label: "Lien de la page détaillée de cette édition", name: "link", widget: "string" }
      - { label: "Ordre d'affichage (1, 2, 3…)", name: "order", widget: "number", default: 1 }
      - { label: "Afficher sur le site ?", name: "active", widget: "boolean", default: true }
      - { label: "Description complète", name: "body", widget: "markdown" }

  # ------------------------------------------------------------------
  # 4) NOS PROJETS
  # ------------------------------------------------------------------
  - name: "projects"
    label: "📁 Nos projets"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom du projet", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Courte description (affichée sur l'accueil et la liste des projets)", name: "courtedescription", widget: "text" }
      - { label: "Lien vers la page complète du projet", name: "link", widget: "string" }
      - { label: "Ordre d'affichage (1, 2, 3…)", name: "order", widget: "number", default: 1 }
      - { label: "Afficher sur le site ?", name: "active", widget: "boolean", default: true }

  # ------------------------------------------------------------------
  # 5) GALERIE PHOTO
  # ------------------------------------------------------------------
  - name: "gallery"
    label: "🖼️ Galerie photo"
    folder: "_gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre de la photo", name: "title", widget: "string" }
      - { label: "Catégorie / légende", name: "category", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Ordre d'affichage (1, 2, 3…)", name: "order", widget: "number", default: 1 }
      - { label: "Afficher sur le site ?", name: "active", widget: "boolean", default: true }

  # ------------------------------------------------------------------
  # 6) HERO / BANDEAU DÉFILANT DE L'ACCUEIL
  # ------------------------------------------------------------------
  - name: "slides"
    label: "🎞️ Bandeau défilant (accueil)"
    folder: "_slides"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre affiché", name: "title", widget: "string" }
      - { label: "Description affichée", name: "description", widget: "text" }
      - { label: "Image de fond", name: "image", widget: "image" }
      - { label: "Ordre d'affichage (1, 2, 3…)", name: "order", widget: "number", default: 1 }
      - { label: "Afficher sur le site ?", name: "active", widget: "boolean", default: true }

  # ------------------------------------------------------------------
  # 7) À PROPOS DE MAISON VERTE
  # ------------------------------------------------------------------
  - name: "aboutus"
    label: "🌿 À propos de Maison Verte"
    folder: "_aboutus"
    create: false
    delete: false
    slug: "a-propos-de-maison-verte"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Slogan (affiché en haut de la page)", name: "slogan", widget: "text" }
      - { label: "Qui sommes-nous (onglet 1)", name: "description", widget: "text" }
      - { label: "Notre mission (onglet 2)", name: "mission", widget: "text" }
      - { label: "Notre vision (onglet 3)", name: "vision", widget: "text" }
      - { label: "Afficher sur le site ?", name: "active", widget: "boolean", default: true }

  # ------------------------------------------------------------------
  # 8) PAGES AVANCÉES — pages riches en HTML (mini-sites Cinécolo, etc.)
  #    À modifier avec prudence : le contenu est en HTML brut.
  # ------------------------------------------------------------------
  - name: "pages_avancees"
    label: "🛠️ Pages avancées (HTML) — à modifier avec prudence"
    files:
      - { name: "cinecolo_accueil", label: "Cinécolo — page d'accueil du projet", file: "projects/cinecolo/index.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "cinecolo_galerie", label: "Cinécolo — galerie", file: "projects/cinecolo/public/gallery.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "cinecolo_invites", label: "Cinécolo — invités", file: "projects/cinecolo/public/invites.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "cinecolo_presse", label: "Cinécolo — revue de presse", file: "projects/cinecolo/public/lapresse.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "cinecolo_editions", label: "Cinécolo — éditions (archive)", file: "projects/cinecolo/public/leseditions.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "cinecolo_actus", label: "Cinécolo — actualités", file: "projects/cinecolo/public/news.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "karibiodiv", label: "Projet Karibiodiv — page complète", file: "projects/karibiodiv/index.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "jadenfanm", label: "Projet Jaden Fanm — page complète", file: "projects/jadenfanm/index.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
      - { name: "jedisvert", label: "Projet Je Dis Vert — page complète", file: "projects/jedisvert/index.html", fields: [{label: "Contenu HTML complet", name: "body", widget: "markdown"}] }
