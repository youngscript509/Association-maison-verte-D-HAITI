# Welcome to Jekyll!
#
# Ce fichier configure l'ensemble du site. La plupart des textes affichés sur
# le site ne sont PAS ici : ils sont gérés via le CMS (/admin) dans les
# dossiers _data, _posts, _slides, _leseditions, _projects, _gallery,
# _presses et _aboutus. Ne modifie ce fichier que pour des changements
# techniques (thème, plugins, structure des collections).

title: "Maison Verte Haïti"
email: info@maisonvertehaiti.org
description: "L'Association Maison Verte d'Haïti (ASMAV-HAITI), fondée en 2017, œuvre pour la protection de l'environnement, la résilience climatique et l'autonomisation des communautés vulnérables, en particulier des femmes rurales."
baseurl: ""
url: "https://maisonvertehaiti.org"
lang: fr

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

kramdown:
  parse_block_html: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - GUIDE-CMS.md
  - node_modules
  - vendor

# Collections
# `output: true`  -> chaque élément obtient sa propre page publique
# `output: false` -> l'élément est seulement utilisé dans des listes (accueil, etc.)
collections:
  posts:
    output: false
  slides:
    output: false
  leseditions:
    output: true
  aboutus:
    output: false
  projects:
    output: false
  gallery:
    output: false
