<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} - Semer le Vert, Protéger La Terre, Faire Respirer Haïti</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Maison verte,Haiti,Cinecolo,Jaden fanm,KAribiodiv,Je dis vert,Biodiverste,Environnement,Protection Environnement" name="keywords">
    <meta content="{% if page.description %}{{ page.description | strip_html | truncate: 160 }}{% else %}{{ site.description | truncate: 160 }}{% endif %}" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/lightbox/css/lightbox.min.css" rel="stylesheet">


    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
    <link href="/assets/css/styles.css" rel="stylesheet">
</head>

<body>
    <!-- PRELOADER -->
    <div id="preloader" aria-hidden="false">
        <div class="logo-sm" aria-hidden="true">
            <!-- simple leaf logo SVG -->
            <img src="https://maisonvertehaiti.org/assets/img/logomaisonverte.jpg" style="width: 60px;height:60px;border-radius:50%;" alt="">

        </div>
        <h1>Association Maison Verte d'Haïti</h1>
        <div class="bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

 
    <!--header-->
    {% include header.html %}
    <!-- NATURAL ANIMATIONS -->
<div id="leaf-container"></div>
<div id="mist-layer"></div>
<div id="light-rays"></div>
   
    <!-- Header Start -->
    <div class="container-fluid bg-breadcrumb">
        <div class="container text-center py-5" style="max-width: 900px;">
            <h3 class="text-white display-3 mb-4">{{page.title}}</h3>
                <p class="fs-5 text-white mb-4">{{page.description}}</p>
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                    <li class="breadcrumb-item"><a href="/">Pages</a></li>
                    <li class="breadcrumb-item active text-white">{{page.title}}</li>
                </ol>
        </div>
    </div>
     <div class="leaf" id="leaf1" style="left:6%;top:20%;transform:rotate(-22deg);"><img src="/assets/img/oi2.png" alt=""></div>
  <div class="leaf" id="leaf2" style="right:8%;top:38%;transform:rotate(12deg);"><img src="/assets/img/oi1.png" alt=""></div>

    <!-- Header End -->
    <!--content-->
    <main>
        <!--Display content here -->
        {{ content }}
        <!-- NATURAL ANIMATIONS -->
 
    </main>
    <!--footer-->
    {% include footer.html %}
        
  
    <script src="/assets/js/main.js" defer></script>


    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/lib/waypoints/waypoints.min.js"></script>
    <script src="/lib/counterup/counterup.min.js"></script>
    <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="/lib/lightbox/js/lightbox.min.js"></script>


    <!-- Template Javascript -->
    <script src="/js/main.js"></script>

</body>

</html>
