    <script>
        const RSS_URL = "https://www.actu-environnement.com/flux/rss/biodiversite/";

        const API = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}&api_key=1lzg8e9cuvvkengm3dqopbskivswqrbo0phf0gdg`;

        fetch(API)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("flux-rss");
                container.innerHTML = "";

                data.items.slice(0, 4).forEach((item, i) => {
                    container.innerHTML += `
        <div class="rss-slide card ${i === 0 ? "active" : ""}">
          <h3>${item.title}</h3>
          <p>${item.pubDate.split(" ")[0]}</p>
          <a href="${item.link}" target="_blank">Lire l’article</a>
        </div>
      `;
                });

                // ✅ Lancer le slider UNIQUEMENT après injection

            })
            .catch(err => console.error("Erreur RSS :", err));
    </script>
