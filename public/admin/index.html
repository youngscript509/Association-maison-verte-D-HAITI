<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Festival Cinecolo</title>
    <script src="https://unpkg.com/netlify-cms@2.10.192/dist/netlify-cms.js"></script>
  </head>
  <body>
    <script>
  // Initialize Netlify CMS
  if (window.NetlifyCmsApp) {
    window.NetlifyCmsApp.init();
  } else {
    console.error("Netlify CMS failed to initialize.");
  }
</script>
    <h1>Admin Dashboard</h1>
    <p>Welcome to the Festival Cinecolo Admin Dashboard.</p>
    <p>Please use the sidebar to navigate through the admin features.</p>
    <script>
      // Check if Netlify CMS is loaded
      if (window.NetlifyCmsApp) {
        console.log("Netlify CMS is loaded successfully.");
      } else {
        console.error("Netlify CMS failed to load.");
      }
    </script>
  </body>
</html>
