coordinateur:
  name: "Messerne SAGESSE"
  role: "Militant Ecologiste"
  photo: /img/coordonateur.jpg
  message: |
    Chers visiteurs,

    L'Association Maison Verte d'Haïti est née d'une conviction profonde : la justice sociale, l'égalité de genre et la protection de l'environnement sont étroitement liées. Face aux crises climatiques, aux inégalités persistantes et à la fragilisation de nos territoires, nous sommes convaincus que les solutions durables doivent émerger des communautés elles-mêmes, avec un rôle central joué par les femmes et les jeunes.

    Notre engagement repose sur une vision à la fois militante et responsable.

    Militante, parce que nous défendons un modèle de société dans lequel les ressources naturelles sont protégées, les droits des femmes pleinement reconnus et exercés, et où l'agroécologie, la culture et l'éducation citoyenne deviennent de véritables leviers de transformation sociale.

    Responsable, parce que nos actions s'appuient sur la rigueur, le dialogue, le partenariat et la recherche d'un impact durable, mesurable et partagé.

    À travers nos programmes et initiatives, nous accompagnons les dynamiques locales, valorisons les savoir-faire communautaires et plaidons pour des modèles de développement plus justes, plus résilients et respectueux des équilibres écologiques.

    L'Association Maison Verte d'Haïti poursuivra, avec détermination et responsabilité, son action aux côtés des communautés, des organisations partenaires et des institutions.

    **Messerne SAGESSE, Ecologiste**
